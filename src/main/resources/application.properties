spring.application.name=sgt

# Migration datasource - connects as sgt_migrator (owns the schema, holds
# DDL rights). Spring Boot wires this as a separate datasource from
# spring.datasource whenever these properties are set.
# Schema is owned by Flyway migrations, not Hibernate. Setting its value
# to "validate" just checks entities match what migrations already created.
spring.flyway.url=${FLYWAY_URL}
spring.flyway.user=${FLYWAY_USERNAME}
spring.flyway.password=${FLYWAY_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate


# Runtime datasource - connects as sgt_app (DML only, no DDL rights).
# See scripts/db/setup-roles.sql and .env.example for the reasoning.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# Event publication registry. One row per (event, listener) is written when the
# event is published, and completed when that listener's method returns normally;
# a listener that throws leaves its row incomplete.
# archive moves a completed row into event_publication_archive, so the live table
# holds the backlog and nothing else while the history survives. See V3.
spring.modulith.events.completion-mode=archive


# Incomplete publications are otherwise never retried: a process that dies between
# the listener's commit and its completion leaves a row nothing looks at again.
# Republishing at startup requires listeners to be idempotent, and assumes one
# instance, since every instance would republish the same backlog on its own boot.
spring.modulith.events.republish-outstanding-events-on-restart=true


# A listener that started and never returned leaves its publication PROCESSING
# forever. The monitor marks one FAILED once it is older than these, which takes it
# out of the in-flight set and leaves it queryable, and the restart republish above
# still picks it up. Set them above the slowest listener.
# staleness.published stays unset on purpose: a listener queued behind a backlog
# has not started yet and is not stale. The misspelt interval is Modulith's own.
spring.modulith.events.staleness.processing=5m
spring.modulith.events.staleness.resubmitted=5m
spring.modulith.events.staleness.check-intervall=1m


# Tomcat's access log is written by a Valve outside the filter chain, so it has
# no MDC. It reads the identifier off the response header the filter sets,
# which is what joins a request's timing to the lines it produced.
# This requires giving the log directory an absolute path so it does not resolve
# against a temp directory Tomcat deletes at shutdown.
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D %{X-Request-Id}o
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=${user.dir}/logs


# RequestIdFilter puts the request identifier in the MDC under "requestId", and
# Boot substitutes this pattern into the level field of the console and file
# patterns, so every line written while serving a request carries it.
logging.pattern.level=%5p [%X{requestId:-no-request}]


# Beneficiary registry the people module resolves beneficiaries against, through
# its v1 lookup endpoint, with the token the "beneficiaries" registration below gets.
people.beneficiaries.base-url=${BENEFICIARIES_URL}


# Staff directory the people module resolves field agents and general
# management assistants against, by GUID through its v3 lookup endpoint, with a
# token sgt gets for itself under the directory registration below.
people.directory.base-url=${DIRECTORY_URL}


# poi, where a field sheet's delivery is registered against the task it names,
# then confirmed or rejected once the field sheet is reviewed, with a token sgt
# gets for itself under the poi registration below.
monitoring.poi.base-url=${POI_URL}

# The S3-compatible object store holding field sheets' scanned PDFs. Field
# agents upload to it and reviewers download from it through signed links, so
# the bytes never pass through sgt.
monitoring.scans.endpoint=${SCANS_ENDPOINT}
monitoring.scans.region=${SCANS_REGION}
monitoring.scans.bucket=${SCANS_BUCKET}
monitoring.scans.access-key=${SCANS_ACCESS_KEY}
monitoring.scans.secret-key=${SCANS_SECRET_KEY}


# Requests are admitted only with a bearer token staff issued for sgt. The
# issuer is where the signing keys are discovered from, and must match the
# token's iss; the audience must appear in its aud.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${STAFF_ISSUER}
spring.security.oauth2.resourceserver.jwt.audiences=${SGT_TOKEN_AUDIENCE}

# The claims a caller is read from. staff names them like Entra ID does; a
# provider naming them otherwise is a change here and nowhere else.
sgt.security.claims.subject=sub
sgt.security.claims.roles=roles

# The origin the frontend's browser calls come from.
sgt.web.origin=${SGT_WEB_ORIGIN}


# sgt as a service of its own: the client staff registered it as, and the APIs
# it gets tokens for with the client credentials grant. Each registration asks
# for one API, named by the identifier it is registered under in staff, plus the
# scopes sgt needs there; staff puts that identifier in the token's audience.
spring.security.oauth2.client.provider.staff.token-uri=${STAFF_ISSUER}/oauth2/token

spring.security.oauth2.client.registration.poi.provider=staff
spring.security.oauth2.client.registration.poi.client-id=${SGT_SERVICE_CLIENT_ID}
spring.security.oauth2.client.registration.poi.client-secret=${SGT_SERVICE_CLIENT_SECRET}
spring.security.oauth2.client.registration.poi.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.poi.scope=${POI_TOKEN_AUDIENCE},tasks.read,tasks.write

spring.security.oauth2.client.registration.directory.provider=staff
spring.security.oauth2.client.registration.directory.client-id=${SGT_SERVICE_CLIENT_ID}
spring.security.oauth2.client.registration.directory.client-secret=${SGT_SERVICE_CLIENT_SECRET}
spring.security.oauth2.client.registration.directory.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.directory.scope=${DIRECTORY_TOKEN_AUDIENCE},people.read

spring.security.oauth2.client.registration.beneficiaries.provider=staff
spring.security.oauth2.client.registration.beneficiaries.client-id=${SGT_SERVICE_CLIENT_ID}
spring.security.oauth2.client.registration.beneficiaries.client-secret=${SGT_SERVICE_CLIENT_SECRET}
spring.security.oauth2.client.registration.beneficiaries.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.beneficiaries.scope=${BENEFICIARIES_TOKEN_AUDIENCE},beneficiaries.read


# The OpenAPI document at /v3/api-docs and the Swagger UI over it at
# /swagger-ui/index.html. Off wherever the API is not meant to be browsed.
springdoc.api-docs.enabled=${API_DOCS_ENABLED}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED}
